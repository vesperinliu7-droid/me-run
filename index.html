<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>ME RUN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --yellow:#FFDD46; --ink:#000; --sky:#53B5F9; --lime:#75F94C; --red:#E93323; --gold:#FFC400;
        --field1:#2a1e5c; --field2:#17203f;
        --page:#1b1440; --panel:#241a56; --paper:#fff;
        --shadow:0 4px 0 #000;
      }
      @media (prefers-color-scheme: light){
        :root{ --page:#2a1e5c; --panel:#33236e; }
      }
      *{ box-sizing:border-box; }
      html,body{ margin:0; padding:0; }
      body{
        background:var(--page);
        font-family:"Space Grotesk","PingFang SC","Microsoft YaHei",sans-serif;
        font-weight:700;
        color:#fff;
        -webkit-tap-highlight-color:transparent;
      }
      .wrap{ max-width:720px; margin:0 auto; padding:14px 14px 26px; display:flex; flex-direction:column; gap:12px; }

      /* ---------- header ---------- */
      header{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .brand{
        font-family:"Luckiest Guy","Space Grotesk",sans-serif;
        font-size:clamp(34px,8vw,52px); line-height:1; letter-spacing:1px;
        color:#fff; -webkit-text-stroke:2px #000; paint-order:stroke fill;
        text-shadow:0 4px 0 #000; user-select:none; white-space:nowrap;
      }
      .brand .me{ color:var(--yellow); }
      .hbtns{ display:flex; gap:10px; flex-shrink:0; }
      .round-btn{
        width:48px; height:48px; min-height:48px; border-radius:50%;
        border:3px solid #000; background:var(--yellow); box-shadow:0 3px 0 #000;
        display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
      }
      .round-btn:active{ transform:translateY(3px); box-shadow:0 0 0 #000; }
      .round-btn.sky{ background:var(--sky); }
      .round-btn svg{ width:24px; height:24px; display:block; }
      .round-btn:focus-visible, .big-btn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

      /* ---------- HUD ---------- */
      .hud{ display:flex; flex-wrap:wrap; gap:8px; align-items:stretch; }
      .pill{
        border:3px solid #000; border-radius:999px; box-shadow:0 3px 0 #000;
        padding:6px 14px; display:flex; align-items:baseline; gap:8px; min-height:44px; align-items:center;
      }
      .pill .lab{ font-size:13px; font-weight:700; }
      .pill .num{ font-family:"Luckiest Guy","Space Grotesk",sans-serif; font-size:24px; line-height:1; letter-spacing:.5px; }
      .pill.score{ background:var(--yellow); color:#000; }
      .pill.dark{ background:#171233; color:#fff; }
      .pill.dark .num{ font-size:19px; color:var(--yellow); }
      .pill.speed{ background:var(--sky); color:#000; }
      .pill.speed .num{ font-size:19px; }
      .pill.coin{ background:#fff; color:#000; }
      .pill.coin .num{ font-size:19px; color:#b8860b; }
      .pill.coin .coin-ic{ width:18px; height:18px; border-radius:50%; background:var(--gold); border:2.5px solid #000; display:inline-block; flex-shrink:0; box-shadow:inset 0 0 0 2px #ffe98a; }
      .meta{ display:flex; gap:8px; flex-wrap:wrap; }
      .chip{
        border:2.5px solid #000; border-radius:10px; box-shadow:0 3px 0 #000;
        background:#fff; color:#000; padding:5px 12px; font-size:14px;
        display:inline-flex; gap:7px; align-items:center; min-height:36px;
      }
      .chip b{ font-family:"Luckiest Guy","Space Grotesk",sans-serif; font-weight:400; letter-spacing:.5px; }
      .chip.lvl{ background:var(--lime); }
      .chip.shield{ background:var(--sky); }
      .chip.shield.off{ background:#3a3168; color:#9aa3d6; border-color:#000; }
      .chip.zone{ background:#ffb3e2; }
      .ctrls{ display:flex; gap:10px; }
      .ctrl-btn{
        flex:1; min-height:54px; border:3px solid #000; border-radius:14px; box-shadow:0 4px 0 #000;
        font-family:inherit; font-weight:700; font-size:16px; cursor:pointer; color:#000;
        display:flex; align-items:center; justify-content:center; gap:8px; padding:8px 10px;
      }
      .ctrl-btn:active{ transform:translateY(4px); box-shadow:0 0 0 #000; }
      .ctrl-btn.jump{ background:var(--lime); }
      .ctrl-btn.slide{ background:var(--yellow); }
      .ctrl-btn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

      /* ---------- board ---------- */
      .board{
        position:relative; border:3.5px solid #000; border-radius:18px; box-shadow:0 6px 0 #000;
        overflow:hidden; background:linear-gradient(180deg,var(--field1),var(--field2));
        touch-action:none; user-select:none; -webkit-user-select:none;
      }
      canvas{ display:block; width:100%; height:auto; }

      /* ---------- overlays ---------- */
      .overlay{
        position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:10px; padding:12px; text-align:center; background:rgba(16,10,44,.55);
      }
      .overlay.over .ov-title{ font-size:clamp(25px,6vw,36px); }
      .overlay.over .rank{ font-size:clamp(19px,5vw,26px); padding:4px 16px; }
      .overlay.over .stat{ min-width:72px; padding:5px 10px; }
      .overlay.over .stat b{ font-size:20px; }
      .overlay.over .big-btn{ font-size:22px; padding:9px 34px; min-height:50px; }
      .overlay[hidden]{ display:none; }
      .ov-title{
        font-family:"Luckiest Guy","Space Grotesk",sans-serif; font-size:clamp(30px,7vw,44px); line-height:1.05;
        color:#fff; -webkit-text-stroke:2px #000; paint-order:stroke fill; text-shadow:0 4px 0 #000; letter-spacing:1px;
      }
      .ov-title .y{ color:var(--yellow); }
      .ov-title .r{ color:var(--red); -webkit-text-stroke:2px #000; }
      .chips{ display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; max-width:470px; }
      .how-chip{
        background:#fff; color:#000; border:2.5px solid #000; border-radius:999px; box-shadow:0 3px 0 #000;
        padding:6px 10px; font-size:12.5px; min-height:36px; display:inline-flex; align-items:center; justify-content:center; text-align:center;
      }
      .how-chip.wide{ grid-column:1 / -1; }
      .overlay.start{ justify-content:flex-start; padding-top:16px; }
      .overlay.start .big-btn{ align-self:flex-end; margin-right:4%; }
      .overlay.start .ov-title{ font-size:clamp(28px,6vw,40px); }
      .big-btn{
        font-family:"Luckiest Guy","Space Grotesk",sans-serif; letter-spacing:1px;
        background:var(--lime); color:#000; border:3.5px solid #000; border-radius:16px; box-shadow:0 5px 0 #000;
        font-size:26px; padding:12px 42px; min-height:58px; cursor:pointer;
      }
      .big-btn:active{ transform:translateY(5px); box-shadow:0 0 0 #000; }
      .big-btn.yellow{ background:var(--yellow); font-size:20px; padding:10px 26px; min-height:52px; }
      .btn-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
      .rank{
        font-family:"Luckiest Guy","Space Grotesk",sans-serif; font-size:clamp(22px,5.5vw,30px);
        background:var(--gold); color:#000; border:3px solid #000; border-radius:12px; box-shadow:0 4px 0 #000;
        padding:6px 20px; letter-spacing:1px;
      }
      .stats{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
      .stat{
        background:#171233; border:2.5px solid #000; border-radius:12px; box-shadow:0 3px 0 #000;
        padding:7px 14px; font-size:13px; color:#cfd6ff; display:flex; flex-direction:column; gap:1px; min-width:86px;
      }
      .stat b{ font-family:"Luckiest Guy","Space Grotesk",sans-serif; font-weight:400; font-size:23px; color:#fff; line-height:1.1; }
      .stat.gold b{ color:var(--gold); }
      .newbest{
        background:var(--red); color:#fff; border:2.5px solid #000; border-radius:999px; box-shadow:0 3px 0 #000;
        padding:5px 14px; font-size:13.5px;
      }
      .count-num{
        font-family:"Luckiest Guy","Space Grotesk",sans-serif; font-size:clamp(70px,18vw,120px); line-height:1;
        color:var(--yellow); -webkit-text-stroke:3px #000; paint-order:stroke fill; text-shadow:0 6px 0 #000;
      }
      .count-num.pop{ animation:cpop .55s ease-out; }
      @keyframes cpop{ 0%{ transform:scale(1.9); } 60%{ transform:scale(.94); } 100%{ transform:scale(1); } }
      .hint{ font-size:13.5px; color:#dfe4ff; }
      @media (prefers-reduced-motion: reduce){
        .count-num.pop{ animation:none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand"><span class="me">ME</span> RUN</div>
        <div class="hbtns">
          <button class="round-btn" id="muteBtn" type="button" aria-label="静音开关">
            <svg id="sndOn" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#000"/><path d="M16 9c1.2 1.6 1.2 4.4 0 6M18.5 6.5c2.3 3 2.3 8 0 11" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></svg>
            <svg id="sndOff" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#000"/><path d="M16 9l6 6M22 9l-6 6" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <button class="round-btn sky" id="pauseBtn" type="button" aria-label="暂停">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="5" width="4.4" height="14" rx="1.4" fill="#000"/><rect x="13.6" y="5" width="4.4" height="14" rx="1.4" fill="#000"/></svg>
          </button>
        </div>
      </header>

      <div class="hud">
        <div class="pill score"><span class="lab">分数</span><span class="num" id="scoreNum">0</span></div>
        <div class="pill dark"><span class="lab">距离</span><span class="num" id="distNum">0m</span><span class="lab">连跳</span><span class="num" id="comboNum">×0</span></div>
        <div class="pill coin"><span class="coin-ic" aria-hidden="true"></span><span class="lab">金币</span><span class="num" id="coinNum">0</span></div>
        <div class="pill speed"><span class="lab">速度</span><span class="num" id="speedNum">×1.0</span></div>
      </div>
      <div class="meta">
        <span class="chip">BEST <b id="bestNum">0</b></span>
        <span class="chip lvl">LEVEL <b id="levelNum">1</b></span>
        <span class="chip shield off" id="shieldChip">🛡 护盾 <b id="shieldNum">无</b></span>
        <span class="chip zone" id="zoneChip">场景 <b id="zoneNum">星夜</b></span>
      </div>

      <div class="board" id="board">
        <canvas id="cv" width="720" height="420"></canvas>

        <div class="overlay start" id="startOv">
          <div class="ov-title"><span class="y">ME</span> RUN</div>
          <div class="chips">
            <span class="how-chip">点按 / 空格跳跃，空中再点一次二段跳</span>
            <span class="how-chip">下滑 / ↓ 键滑铲，钻过无人机</span>
            <span class="how-chip">吃金币 +5 分，吃星星 +25 分</span>
            <span class="how-chip">蓝色护盾能挡一次撞击</span>
            <span class="how-chip">贴身擦过障碍有惊险奖励 +5</span>
            <span class="how-chip wide">每 250 米换一个场景，速度也越来越快</span>
          </div>
          <button class="big-btn" id="playBtn" type="button">PLAY</button>
        </div>

        <div class="overlay" id="countOv" hidden style="background:transparent">
          <div class="count-num" id="countNum">3</div>
        </div>

        <div class="overlay" id="pauseOv" hidden>
          <div class="ov-title">已暂停</div>
          <div class="btn-row">
            <button class="big-btn" id="resumeBtn" type="button" style="font-size:21px;padding:10px 30px;min-height:52px">继续</button>
            <button class="big-btn yellow" id="restartBtn" type="button">重新开始</button>
          </div>
        </div>

        <div class="overlay over" id="overOv" hidden>
          <div class="ov-title"><span class="r">GAME OVER</span></div>
          <div class="rank" id="rankTxt">起步新手</div>
          <div class="newbest" id="newBest" hidden>新纪录！</div>
          <div class="stats">
            <div class="stat"><span>分数</span><b id="finalScore">0</b></div>
            <div class="stat"><span>距离</span><b id="finalDist">0m</b></div>
            <div class="stat"><span>跳过障碍</span><b id="finalClear">0</b></div>
            <div class="stat"><span>金币</span><b id="finalCoins">0</b></div>
            <div class="stat"><span>最高连跳</span><b id="finalCombo">×0</b></div>
            <div class="stat gold"><span>BEST</span><b id="finalBest">0</b></div>
          </div>
          <button class="big-btn" id="replayBtn" type="button">REPLAY</button>
        </div>
      </div>

      <div class="ctrls">
        <button class="ctrl-btn jump" id="jumpBtn" type="button">⬆ 跳跃 · 二段跳</button>
        <button class="ctrl-btn slide" id="slideBtn" type="button">⬇ 滑铲 · 下滑</button>
      </div>
      <div class="hint">跑道上是你本人的卡通小人：点按跑道跳跃，空中再点一次二段跳；下滑手势、↓ 键或滑铲按钮可以钻过低空无人机。金币和星星别错过，护盾能救你一次。</div>
    </div>

      /* ---------- audio ---------- */
      var AC = null, master = null, muted = false;
      function initAudio(){
        if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
        try {
          AC = new (window.AudioContext || window.webkitAudioContext)();
          master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
        } catch(e){ AC = null; }
      }
      function tone(freq, dur, type, vol, slideTo, delay){
        if (!AC || muted) return;
        var t0 = AC.currentTime + (delay || 0);
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, t0);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
        g.gain.setValueAtTime(vol || 0.5, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + dur + 0.02);
      }
      function noiseBurst(dur, vol){
        if (!AC || muted) return;
        var len = Math.floor(AC.sampleRate * dur);
        var buf = AC.createBuffer(1, len, AC.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        var src = AC.createBufferSource(); src.buffer = buf;
        var g = AC.createGain(); g.gain.value = vol;
        var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
        src.connect(f); f.connect(g); g.connect(master); src.start();
      }

        distPx = 0; bonus = 0; cleared = 0; combo = 0; maxCombo = 0;
        level = 1; elapsed = 0; speedF = 1;
        coinCount = 0; hasShield = false; themeIdx = 0; themeBlend = 0; shieldFlashT = 0;
        spawnIn = 500; pickupIn = 700; shakeT = 0; crashT = 0; dustTimer = 0; overShown = false;
        runner.x = Math.round(W * 0.16);
        updateHUD();
      }
      function score(){ return Math.floor(distPx / 40) + bonus; }

      function makeClouds(){
        clouds = []; hills = [];
        for (var i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 18 + Math.random() * 90, s: 0.6 + Math.random() * 0.9 });
        for (var j = 0; j < 8; j++) hills.push({ x: j * 130 + Math.random() * 40, w: 70 + Math.random() * 60, h: 40 + Math.random() * 55 });
      }

      /* ---------- sizing ---------- */
      function resize(){
        var w = board.clientWidth;
        var h = Math.round(Math.max(348, Math.min(440, w * 0.62)));
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        cv.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        W = w; H = h; S = H / 420;
        groundY = H - Math.round(64 * S);
        if (runner) runner.x = Math.round(W * 0.16);
        if (!clouds) makeClouds();
      }
      window.addEventListener('resize', resize);

      /* ---------- obstacles & pickups ---------- */
      function makeObstacle(type, x){
        var o = { type: type, x: x, passed: false, nearDone: false, phase: Math.random() * 6.28 };
        if (type === 'cone'){ o.w = 44 * S; o.h = 54 * S; }
        else if (type === 'barrier'){ o.w = 62 * S; o.h = 58 * S; }
        else if (type === 'tall'){ o.w = 58 * S; o.h = 96 * S; }
        else if (type === 'drone'){ o.w = 64 * S; o.h = 34 * S; o.flyH = 52 * S; }
        else { o.w = 56 * S; o.h = 48 * S; } // spike
        return o;
      }
      function spawnObstacle(){
        var pool = ['cone', 'barrier', 'spike'];
        if (level >= 2) pool.push('drone', 'drone');
        if (level >= 3) pool.push('tall');
        var t = pool[Math.floor(Math.random() * pool.length)];
        var roll = Math.random();
        if (t !== 'drone' && roll < 0.22){
          // double pattern: two ground obstacles in a row — needs a long or double jump
          obstacles.push(makeObstacle(t, W + 60));
          obstacles.push(makeObstacle(t === 'tall' ? 'cone' : t, W + 60 + 74 * S));
          spawnIn = (560 + Math.random() * 300) / Math.min(speedF, 1.7);
          return;
        }
        obstacles.push(makeObstacle(t, W + 60));
        var base = 400 + Math.random() * 320;
        spawnIn = base / Math.min(speedF, 1.7);
      }
      function spawnPickup(){
        var roll = Math.random();
        var baseX = W + 50;
        if (roll < 0.14 && !hasShield){
          pickups.push({ kind: 'shield', x: baseX, yOff: 96 * S, r: 17 * S, taken: false, phase: Math.random() * 6.28 });
        } else if (roll < 0.30){
          pickups.push({ kind: 'star', x: baseX, yOff: (70 + Math.random() * 90) * S, r: 15 * S, taken: false, phase: Math.random() * 6.28 });
        } else {
          // a little arc of 4–6 coins
          var n = 4 + Math.floor(Math.random() * 3);
          var peak = (55 + Math.random() * 95) * S;
          for (var i = 0; i < n; i++){
            var k = n === 1 ? 0 : i / (n - 1);
            pickups.push({ kind: 'coin', x: baseX + i * 40 * S, yOff: 34 * S + Math.sin(k * Math.PI) * peak, r: 12 * S, taken: false, phase: i * 0.7 });
          }
        }
        pickupIn = 650 + Math.random() * 750;
      }
      function obstacleBox(o){
        if (o.type === 'drone'){
          var cy = groundY - o.flyH - o.h / 2 + Math.sin(o.phase) * 4 * S;
          return { l: o.x + 4 * S, r: o.x + o.w - 4 * S, t: cy - o.h * 0.36, b: cy + o.h * 0.36 };
        }
        return { l: o.x + o.w * 0.16, r: o.x + o.w * 0.84, t: groundY - o.h * 0.88, b: groundY - 2 };
      }

      /* ---------- FX ---------- */
      function dust(x, y, n){
        for (var i = 0; i < n; i++)
          particles.push({ kind:'dust', x: x + (Math.random()*14-7), y: y - Math.random()*4, vx: -40 - Math.random()*70, vy: -20 - Math.random()*45, life: 0, ttl: 0.4 + Math.random()*0.3, r: 3 + Math.random()*5 });
      }
      function stars(x, y, n, colors){
        for (var i = 0; i < n; i++){
          var a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 240;
          particles.push({ kind:'star', x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 90, life: 0, ttl: 0.55 + Math.random()*0.35, r: 4 + Math.random()*5, rot: Math.random()*3, c: colors[i % colors.length] });
        }
      }
      function ring(x, y, color){ rings.push({ x: x, y: y, r: 6, life: 0, ttl: 0.38, c: color }); }
      function pop(x, y, txt, color, size){ pops.push({ x: x, y: y, txt: txt, c: color, size: size || 26, life: 0, ttl: 0.8 }); }

      /* ---------- flow ---------- */
      function startCountdown(){
        resetRun();
        startOv.hidden = true; overOv.hidden = true; pauseOv.hidden = true;
        countOv.hidden = false;
        state = 'countdown'; cdT = 0; cdStep = -1;
      }
      function pauseGame(){
        if (state !== 'play' && state !== 'countdown') return;
        stateBeforePause = state;
        state = 'pause';
        if (stateBeforePause === 'countdown') countOv.hidden = true;
        pauseOv.hidden = false;
      }
      function resumeGame(){
        if (state !== 'pause') return;
        pauseOv.hidden = true;
        if (stateBeforePause === 'countdown') countOv.hidden = false;
        state = stateBeforePause;
      }
      function rankFor(s){
        if (s < 80) return '起步新手';
        if (s < 200) return '稳步前进';
        if (s < 400) return '飞毛腿';
        if (s < 700) return '疾风跑者';
        return '闪电跑者';
      }
      function gameOver(){
        state = 'over';
        var sc = score();
        var isNew = sc > best;
        if (isNew){ best = sc; try { localStorage.setItem(BEST_KEY, String(best)); } catch(e){} }
        bestNum.textContent = best;
        document.getElementById('rankTxt').textContent = rankFor(sc);
        document.getElementById('newBest').hidden = !isNew;
        document.getElementById('finalScore').textContent = sc;
        document.getElementById('finalDist').textContent = Math.floor(distPx / 40) + 'm';
        document.getElementById('finalClear').textContent = cleared;
        document.getElementById('finalCoins').textContent = coinCount;
        document.getElementById('finalCombo').textContent = '×' + maxCombo;
        document.getElementById('finalBest').textContent = best;
        overOv.hidden = false;
      }
      function doCrash(o){
        var cx = runner.x + 40 * S, cy = groundY - runner.y - 40 * S;
        if (hasShield){
          // shield eats the hit: smash the obstacle, brief invulnerability, keep running
          hasShield = false; shieldFlashT = 0.45;
          runner.invulnT = 1.1;
          obstacles.splice(obstacles.indexOf(o), 1);
          combo = 0;
          shakeT = reduced ? 0 : 0.18;
          stars(cx, cy, 12, ['#53B5F9', '#fff', '#FFDD46']);
          ring(cx, cy, '#53B5F9');
          pop(cx, cy - 52 * S, '护盾挡下了！', '#53B5F9', 28);
          sfx.save();
          updateHUD();
          return;
        }
        state = 'crash'; crashT = 0;
        shakeT = reduced ? 0 : 0.32;
        stars(cx, cy, 14, ['#FFDD46', '#FFC400', '#fff', '#E93323']);
        ring(cx, cy, '#E93323');
        pop(cx, cy - 46 * S, '砰！', '#E93323', 34);
        sfx.crash();
      }
      function doJump(){
        if (state !== 'play') return;
        if (runner.grounded){
          runner.grounded = false; runner.jumps = 1;
          runner.vy = 1090 * S;
          runner.stretchT = 0.09; runner.slideT = 0;
          dust(runner.x + 26 * S, groundY, 5);
          sfx.jump();
        } else if (runner.jumps < 2){
          runner.jumps = 2;
          runner.vy = 960 * S;
          runner.stretchT = 0.09;
          ring(runner.x + 40 * S, groundY - runner.y - 4 * S, '#fff');
          dust(runner.x + 26 * S, groundY - runner.y, 4);
          pop(runner.x + 40 * S, groundY - runner.y - 92 * S, '二段跳！', '#75F94C', 21);
          sfx.dbl();
        }
      }
      function doSlide(){
        if (state !== 'play') return;
        if (!runner.grounded){ runner.vy = Math.min(runner.vy, -1250 * S); return; } // slam down fast
        if (runner.slideT <= 0) sfx.slide();
        runner.slideT = 0.55;
      }

      /* ---------- update ---------- */
      function update(dt){
        // background always drifts a little on start screen
        var drift = (state === 'play' || state === 'crash') ? speedF : 0.25;
        var i, c;
        for (i = 0; i < clouds.length; i++){ c = clouds[i]; c.x -= 14 * drift * dt; if (c.x < -90) { c.x = W + 30; c.y = 18 + Math.random() * 90; } }
        for (i = 0; i < hills.length; i++){ var hl = hills[i]; hl.x -= 60 * drift * dt; if (hl.x + hl.w < 0) { hl.x = W + Math.random() * 30; hl.h = 40 + Math.random() * 55; } }

        if (state === 'countdown'){
          cdT += dt;
          var step = Math.floor(cdT / 0.62);
          if (step !== cdStep && step <= 3){
            cdStep = step;
            countNum.textContent = step < 3 ? String(3 - step) : 'GO!';
            countNum.classList.remove('pop'); void countNum.offsetWidth; countNum.classList.add('pop');
            if (step < 3) sfx.beep(); else sfx.go();
          }
          if (cdT >= 0.62 * 4){ countOv.hidden = true; state = 'play'; }
          return;
        }
        if (state !== 'play' && state !== 'crash') { updateFx(dt); return; }

        if (state === 'crash'){
          crashT += dt;
          runner.rot = Math.min(1.35, runner.rot + dt * 5);
          if (crashT > 0.7 && !overShown){ overShown = true; gameOver(); }
          updateFx(dt);
          return;
        }

        // --- play ---
        elapsed += dt;
        var newLevel = 1 + Math.floor(distPx / 40 / 250);
        speedF = Math.min(2.6, 1 + elapsed * 0.011 + (newLevel - 1) * 0.16);
        if (newLevel > level){
          level = newLevel;
          pop(W / 2, H * 0.32, 'LEVEL ' + level, '#75F94C', 40);
          pop(W / 2, H * 0.32 + 44 * S, themeAt(level - 1).name, '#FFB3E2', 24);
          ring(runner.x + 40 * S, groundY - 50 * S, '#75F94C');
          sfx.level();
        }
        // smooth zone crossfade across the first stretch of each level
        var levelDist = (distPx / 40) % 250;
        themeIdx = level - 1;
        themeBlend = Math.max(0, Math.min(1, (levelDist - 215) / 35));
        var speed = 305 * speedF * S;
        distPx += speed * dt;
        if (runner.invulnT > 0) runner.invulnT -= dt;
        if (shieldFlashT > 0) shieldFlashT -= dt;

        // runner physics
        if (!runner.grounded){
          runner.vy -= 2650 * S * dt;
          runner.y += runner.vy * dt;
          if (runner.y <= 0){
            runner.y = 0; runner.vy = 0; runner.grounded = true; runner.jumps = 0;
            runner.squashT = 0.07; // 70ms squash
            dust(runner.x + 26 * S, groundY, 6);
          }
        } else {
          runner.bob += dt * 16;
          dustTimer -= dt;
          if (dustTimer <= 0){ dust(runner.x + 10 * S, groundY, 1); dustTimer = runner.slideT > 0 ? 0.07 : 0.14; }
        }
        if (runner.slideT > 0) runner.slideT -= dt;
        if (runner.squashT > 0) runner.squashT -= dt;
        if (runner.stretchT > 0) runner.stretchT -= dt;

        // runner hitbox (much shorter while sliding)
        var sliding = runner.grounded && runner.slideT > 0;
        var rBox = sliding
          ? { l: runner.x + 8 * S, r: runner.x + 76 * S, t: groundY - 40 * S, b: groundY - 2 * S }
          : { l: runner.x + 14 * S, r: runner.x + 66 * S, t: groundY - runner.y - 78 * S, b: groundY - runner.y - 4 * S };
        var rCx = runner.x + 40 * S, rCy = groundY - runner.y - 40 * S;

        // obstacles
        spawnIn -= speed * dt;
        if (spawnIn <= 0) spawnObstacle();
        for (i = obstacles.length - 1; i >= 0; i--){
          var o = obstacles[i];
          o.x -= speed * dt;
          o.phase += dt * 6;
          if (!o.passed && o.x + o.w < runner.x + 10 * S){
            o.passed = true; cleared++; combo++; if (combo > maxCombo) maxCombo = combo;
            bonus += 10;
            var popY = o.type === 'drone' ? groundY - o.flyH - o.h - 20 * S : groundY - o.h - 26 * S;
            pop(o.x + o.w / 2, popY, '+10', '#FFDD46', 27);
            ring(o.x + o.w / 2, groundY - o.h / 2, '#53B5F9');
            stars(o.x + o.w / 2, groundY - o.h, 5, ['#FFDD46', '#75F94C', '#fff']);
            sfx.clear();
          }
          var oBox = obstacleBox(o);
          if (runner.invulnT <= 0 && rBox.l < oBox.r && rBox.r > oBox.l && rBox.t < oBox.b && rBox.b > oBox.t){
            doCrash(o);
            if (state !== 'play') { updateFx(dt); updateHUD(); return; }
            continue;
          }
          // near-miss: slipped past within a whisker without touching
          if (!o.nearDone && !o.passed){
            var gapX = Math.max(oBox.l - rBox.r, rBox.l - oBox.r);
            var gapY = Math.max(oBox.t - rBox.b, rBox.t - oBox.b);
            if (gapX < 16 * S && gapY < 16 * S && (oBox.r > rBox.l - 20 * S) && (oBox.l < rBox.r + 20 * S)){
              o.nearDone = true;
              bonus += 5;
              pop(rCx, rCy - 62 * S, '惊险 +5', '#FF6EC7', 22);
              sfx.near();
            }
          }
          if (o.x + o.w < -70) obstacles.splice(i, 1);
        }

        // pickups
        pickupIn -= speed * dt;
        if (pickupIn <= 0) spawnPickup();
        for (i = pickups.length - 1; i >= 0; i--){
          var pk = pickups[i];
          pk.x -= speed * dt;
          pk.phase += dt * 5;
          var py = groundY - pk.yOff + Math.sin(pk.phase) * 3 * S;
          var dx = pk.x - rCx, dy = py - rCy;
          if (dx * dx + dy * dy < (pk.r + 34 * S) * (pk.r + 34 * S)){
            pickups.splice(i, 1);
            if (pk.kind === 'coin'){
              coinCount++; bonus += 5;
              pop(pk.x, py - 20 * S, '+5', '#FFC400', 21);
              stars(pk.x, py, 3, ['#FFC400', '#fff']);
              sfx.coin();
            } else if (pk.kind === 'star'){
              bonus += 25;
              pop(pk.x, py - 24 * S, '+25', '#75F94C', 27);
              ring(pk.x, py, '#75F94C');
              stars(pk.x, py, 7, ['#75F94C', '#FFDD46', '#fff']);
              sfx.star();
            } else {
              hasShield = true;
              pop(pk.x, py - 24 * S, '护盾！', '#53B5F9', 26);
              ring(rCx, rCy, '#53B5F9');
              sfx.shield();
            }
            continue;
          }
          if (pk.x < -40) pickups.splice(i, 1);
        }
        updateFx(dt);
        updateHUD();
      }
      function updateFx(dt){
        var i;
        for (i = particles.length - 1; i >= 0; i--){
          var p = particles[i]; p.life += dt;
          if (p.life >= p.ttl){ particles.splice(i, 1); continue; }
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.kind === 'star'){ p.vy += 620 * dt; p.rot += dt * 7; }
        }
        for (i = rings.length - 1; i >= 0; i--){ var r = rings[i]; r.life += dt; r.r += 150 * dt; if (r.life >= r.ttl) rings.splice(i, 1); }
        for (i = pops.length - 1; i >= 0; i--){ var q = pops[i]; q.life += dt; q.y -= 44 * dt; if (q.life >= q.ttl) pops.splice(i, 1); }
        if (shakeT > 0) shakeT -= dt;
      }
      function updateHUD(){
        scoreNum.textContent = score();
        distNum.textContent = Math.floor(distPx / 40) + 'm';
        comboNum.textContent = '×' + combo;
        speedNum.textContent = '×' + speedF.toFixed(1);
        levelNum.textContent = level;
        coinNum.textContent = coinCount;
        shieldNum.textContent = hasShield ? '已装备' : '无';
        shieldChip.classList.toggle('off', !hasShield);
        zoneNum.textContent = themeAt(level - 1).name;
      }

      /* ---------- draw ---------- */
      function rr(x, y, w, h, r){
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function drawStar(x, y, r, rot, color){
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
        ctx.beginPath();
        for (var i = 0; i < 10; i++){
          var rad = i % 2 === 0 ? r : r * 0.45;
          var a = i * Math.PI / 5 - Math.PI / 2;
          ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fillStyle = color; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
        ctx.restore();
      }
      function drawObstacle(o){
        var x = o.x, yb = groundY, ink = '#000';
        ctx.lineJoin = 'round';
        if (o.type === 'cone'){
          ctx.beginPath();
          ctx.moveTo(x + o.w / 2, yb - o.h); ctx.lineTo(x + o.w, yb); ctx.lineTo(x, yb); ctx.closePath();
          ctx.fillStyle = '#FFC400'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = ink; ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x + o.w * 0.22, yb - o.h * 0.38); ctx.lineTo(x + o.w * 0.78, yb - o.h * 0.38);
          ctx.lineTo(x + o.w * 0.66, yb - o.h * 0.62); ctx.lineTo(x + o.w * 0.34, yb - o.h * 0.62); ctx.closePath();
          ctx.fillStyle = '#E93323'; ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
          rr(x - 3 * S, yb - 7 * S, o.w + 6 * S, 7 * S, 3); ctx.fillStyle = '#E93323'; ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 3; ctx.stroke();
        } else if (o.type === 'barrier'){
          var top = yb - o.h;
          ctx.fillStyle = '#fff';
          rr(x + 3 * S, top + 14 * S, 6 * S, o.h - 14 * S, 2); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.stroke();
          rr(x + o.w - 9 * S, top + 14 * S, 6 * S, o.h - 14 * S, 2); ctx.fill(); ctx.stroke();
          rr(x, top, o.w, 17 * S, 5); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
          ctx.save(); rr(x, top, o.w, 17 * S, 5); ctx.clip();
          ctx.fillStyle = '#E93323';
          for (var d = -1; d < 4; d++){ ctx.beginPath(); var bx = x + d * 18 * S; ctx.moveTo(bx, top + 17 * S); ctx.lineTo(bx + 9 * S, top); ctx.lineTo(bx + 18 * S, top); ctx.lineTo(bx + 9 * S, top + 17 * S); ctx.closePath(); ctx.fill(); }
          ctx.restore();
          rr(x, top, o.w, 17 * S, 5); ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.stroke();
        } else if (o.type === 'spike') { // spike block
          var top2 = yb - o.h + 14 * S;
          rr(x, top2, o.w, o.h - 14 * S, 5);
          ctx.fillStyle = '#3b2a7a'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = ink; ctx.stroke();
          ctx.fillStyle = '#75F94C';
          var n = 3, sw = o.w / n;
          for (var s2 = 0; s2 < n; s2++){
            ctx.beginPath();
            ctx.moveTo(x + s2 * sw + 2, top2 + 2); ctx.lineTo(x + s2 * sw + sw / 2, top2 - 14 * S); ctx.lineTo(x + (s2 + 1) * sw - 2, top2 + 2); ctx.closePath();
            ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = ink; ctx.stroke();
          }
          ctx.fillStyle = '#FFDD46';
          ctx.beginPath(); ctx.arc(x + o.w * 0.32, top2 + (o.h - 14 * S) * 0.55, 3.4 * S, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(x + o.w * 0.68, top2 + (o.h - 14 * S) * 0.55, 3.4 * S, 0, 7); ctx.fill();
        } else if (o.type === 'tall'){
          // tall hurdle — one jump is not enough, use the double jump
          var tt = yb - o.h;
          rr(x, tt, o.w, o.h, 6);
          ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = ink; ctx.stroke();
          ctx.save(); rr(x, tt, o.w, o.h, 6); ctx.clip();
          ctx.fillStyle = '#E93323';
          for (var ty = 0; ty < 5; ty++){ if (ty % 2 === 0) ctx.fillRect(x, tt + ty * o.h / 5, o.w, o.h / 10); }
          ctx.fillStyle = '#53B5F9';
          ctx.fillRect(x, tt + o.h * 0.44, o.w, o.h * 0.12);
          ctx.restore();
          rr(x, tt, o.w, o.h, 6); ctx.lineWidth = 3.5; ctx.strokeStyle = ink; ctx.stroke();
          ctx.fillStyle = '#000'; ctx.font = '700 ' + Math.round(13 * S) + 'px "Space Grotesk",sans-serif';
          ctx.textAlign = 'center'; ctx.fillText('×2', x + o.w / 2, tt + o.h * 0.44 + 13 * S);
        } else { // drone — flies low, slide underneath it
          var cy = yb - o.flyH - o.h / 2 + Math.sin(o.phase) * 4 * S;
          var cx2 = x + o.w / 2;
          // rotor blur
          ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 3;
          var rw = o.w * (0.42 + Math.sin(o.phase * 3) * 0.05);
          ctx.beginPath(); ctx.moveTo(cx2 - rw, cy - o.h * 0.62); ctx.lineTo(cx2 + rw, cy - o.h * 0.62); ctx.stroke();
          ctx.fillStyle = '#2b2b3d';
          ctx.fillRect(cx2 - 2.5 * S, cy - o.h * 0.62, 5 * S, o.h * 0.2);
          // body
          ctx.beginPath(); ctx.ellipse(cx2, cy, o.w * 0.42, o.h * 0.4, 0, 0, 7);
          ctx.fillStyle = '#E93323'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.stroke();
          // eye
          ctx.beginPath(); ctx.arc(cx2 - o.w * 0.12, cy, 6.5 * S, 0, 7);
          ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
          ctx.beginPath(); ctx.arc(cx2 - o.w * 0.14, cy, 3 * S, 0, 7); ctx.fillStyle = '#000'; ctx.fill();
          // warning stripes
          ctx.fillStyle = '#FFDD46';
          ctx.fillRect(cx2 + o.w * 0.08, cy - 3 * S, o.w * 0.2, 6 * S);
          ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.strokeRect(cx2 + o.w * 0.08, cy - 3 * S, o.w * 0.2, 6 * S);
          // down arrow hint
          ctx.fillStyle = '#FFDD46'; ctx.strokeStyle = ink; ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx2 - 6 * S, cy + o.h * 0.55); ctx.lineTo(cx2 + 6 * S, cy + o.h * 0.55); ctx.lineTo(cx2, cy + o.h * 0.85); ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
      }
      function drawPickup(pk, tNow){
        var py = groundY - pk.yOff + Math.sin(pk.phase) * 3 * S;
        if (pk.kind === 'coin'){
          var sq = Math.abs(Math.cos(pk.phase * 0.9));
          ctx.save(); ctx.translate(pk.x, py); ctx.scale(0.35 + 0.65 * sq, 1);
          ctx.beginPath(); ctx.arc(0, 0, pk.r, 0, 7);
          ctx.fillStyle = '#FFC400'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
          ctx.beginPath(); ctx.arc(0, 0, pk.r * 0.55, 0, 7);
          ctx.fillStyle = '#FFDD46'; ctx.fill();
          ctx.fillStyle = '#000'; ctx.font = '700 ' + Math.round(pk.r * 1.05) + 'px "Space Grotesk",sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('¥', 0, 1);
          ctx.restore(); ctx.textBaseline = 'alphabetic';
        } else if (pk.kind === 'star'){
          drawStar(pk.x, py, pk.r + Math.sin(pk.phase) * 2 * S, pk.phase * 0.4, '#75F94C');
        } else { // shield orb
          ctx.beginPath(); ctx.arc(pk.x, py, pk.r + 3 * S, 0, 7);
          ctx.fillStyle = 'rgba(83,181,249,.28)'; ctx.fill();
          ctx.lineWidth = 2.5; ctx.strokeStyle = '#53B5F9'; ctx.stroke();
          ctx.beginPath(); ctx.arc(pk.x, py, pk.r * 0.62, 0, 7);
          ctx.fillStyle = '#53B5F9'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#000'; ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.font = '700 ' + Math.round(pk.r * 0.95) + 'px "Space Grotesk",sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('盾', pk.x, py + 1);
          ctx.textBaseline = 'alphabetic';
        }
      }
      /* ---------- cartoon runner: cartoon body, the player's own face ---------- */
      function limb(pts, color, w){
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (var pass = 0; pass < 2; pass++){
          ctx.beginPath();
          ctx.moveTo(pts[0], pts[1]);
          for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
          ctx.lineWidth = pass === 0 ? w + 3.5 * S : w;
          ctx.strokeStyle = pass === 0 ? '#000' : color;
          ctx.stroke();
        }
      }
      function shoe(x, y){
        ctx.save(); ctx.translate(x, y);
        rr(-3 * S, -9 * S, 19 * S, 9 * S, 4 * S);
        ctx.fillStyle = '#E93323'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#000'; ctx.stroke();
        rr(-4 * S, -3.5 * S, 21 * S, 4.5 * S, 2 * S);
        ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      function drawHead(cx, cy, w){
        var h = w * (348 / 360);
        if (spriteReady){
          ctx.drawImage(sprite, cx - w / 2, cy - h / 2, w, h);
        } else {
          ctx.beginPath(); ctx.arc(cx, cy, w / 2.2, 0, 7);
          ctx.fillStyle = '#FFDD46'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = '#000'; ctx.stroke();
          ctx.fillStyle = '#000'; ctx.font = '700 16px "Space Grotesk",sans-serif';
          ctx.textAlign = 'center'; ctx.fillText('ME', cx, cy + 6 * S);
        }
      }
      function drawCartoonRunner(sliding){
        var skin = '#F3C39A', shirt = '#FFDD46', shorts = '#53B5F9';
        var ph = runner.bob, i;
        if (sliding){
          // low slide: legs stretched forward, body leaned back, one arm bracing behind
          limb([0, -15 * S, 20 * S, -11 * S, 38 * S, -6 * S], skin, 8 * S); shoe(38 * S, -4 * S);
          limb([-4 * S, -13 * S, 12 * S, -7 * S, 29 * S, -3 * S], skin, 8 * S); shoe(29 * S, -1 * S);
          limb([-18 * S, -20 * S, -28 * S, -11 * S, -33 * S, -2 * S], skin, 7 * S);
          ctx.save(); ctx.translate(-9 * S, -19 * S); ctx.rotate(-0.45);
          rr(-17 * S, -11 * S, 36 * S, 22 * S, 9 * S);
          ctx.fillStyle = shirt; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
          ctx.fillStyle = '#53B5F9'; ctx.fillRect(-17 * S, -3 * S, 36 * S, 5 * S);
          ctx.restore();
          drawHead(23 * S, -29 * S, 52 * S);
          return;
        }
        var air = !runner.grounded;
        var f1x, f1y, f2x, f2y, h1x, h1y, h2x, h2y;
        if (air){
          f1x = 17 * S; f1y = -8 * S; f2x = -16 * S; f2y = -4 * S;
          h1x = -22 * S; h1y = -64 * S; h2x = 24 * S; h2y = -60 * S;
        } else if (state === 'play'){
          var s1 = Math.sin(ph), c1 = Math.cos(ph);
          f1x = s1 * 20 * S; f1y = -3 * S - Math.max(0, c1) * 10 * S;
          f2x = -s1 * 20 * S; f2y = -3 * S - Math.max(0, -c1) * 10 * S;
          h1x = s1 * 13 * S - 4 * S; h1y = -36 * S;
          h2x = -s1 * 13 * S + 4 * S; h2y = -36 * S;
        } else {
          f1x = 9 * S; f1y = -2 * S; f2x = -9 * S; f2y = -2 * S;
          h1x = -14 * S; h1y = -30 * S; h2x = 14 * S; h2y = -30 * S;
        }
        // back arm + back leg (behind the torso)
        limb([-11 * S, -52 * S, -16 * S, -42 * S, h1x, h1y], skin, 7 * S);
        limb([-3 * S, -30 * S, (-3 * S + f2x) / 2 + 4 * S, -17 * S, f2x, f2y], skin, 8.5 * S);
        shoe(f2x, f2y + 2 * S);
        // torso: yellow top with a sky stripe
        rr(-17 * S, -60 * S, 34 * S, 34 * S, 10 * S);
        ctx.fillStyle = shirt; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
        ctx.save(); rr(-17 * S, -60 * S, 34 * S, 34 * S, 10 * S); ctx.clip();
        ctx.fillStyle = '#53B5F9'; ctx.fillRect(-17 * S, -50 * S, 34 * S, 7 * S);
        ctx.restore();
        rr(-17 * S, -60 * S, 34 * S, 34 * S, 10 * S);
        ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
        // shorts
        rr(-16 * S, -34 * S, 32 * S, 11 * S, 5 * S);
        ctx.fillStyle = shorts; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
        // front leg + front arm
        limb([3 * S, -30 * S, (3 * S + f1x) / 2 + 6 * S, -17 * S, f1x, f1y], skin, 8.5 * S);
        shoe(f1x, f1y + 2 * S);
        limb([11 * S, -52 * S, 16 * S, -42 * S, h2x, h2y], skin, 7 * S);
        // sleeve caps
        ctx.beginPath(); ctx.arc(11 * S, -52 * S, 6.5 * S, 0, 7);
        ctx.fillStyle = shirt; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#000'; ctx.stroke();
        ctx.beginPath(); ctx.arc(-11 * S, -52 * S, 6.5 * S, 0, 7);
        ctx.fillStyle = shirt; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#000'; ctx.stroke();
        // head: the player's own face photo on the cartoon body
        var headBob = (!air && state === 'play') ? Math.sin(ph * 2) * 1.2 * S : 0;
        drawHead(1 * S, -76 * S + headBob, 60 * S);
      }
      function draw(){
        ctx.clearRect(0, 0, W, H);
        var sx = 0, sy = 0;
        if (shakeT > 0){ var m = shakeT * 26; sx = (Math.random() * 2 - 1) * m; sy = (Math.random() * 2 - 1) * m * 0.6; }
        ctx.save(); ctx.translate(sx, sy);

        // sky gradient (colors follow the current zone)
        var th = curTheme();
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, th.top); g.addColorStop(1, th.bot);
        ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, H + 60);

        // stars in sky (only in starry zones)
        var si;
        if (th.starSky){
          ctx.fillStyle = 'rgba(255,255,255,.5)';
          for (si = 0; si < 22; si++){
            var px = ((si * 173 + 41) % Math.max(W, 1));
            var py = ((si * 67 + 13) % Math.max(groundY - 130, 40));
            ctx.fillRect(px, py, 2.4, 2.4);
          }
        } else {
          // drifting sparks / petals in non-starry zones
          ctx.fillStyle = 'rgba(255,255,255,.28)';
          for (si = 0; si < 14; si++){
            var px2 = ((si * 211 + 77 + Math.floor(distPx * 0.15)) % Math.max(W, 1));
            var py2 = ((si * 89 + 29) % Math.max(groundY - 110, 40));
            ctx.beginPath(); ctx.arc(px2, py2, 2.6, 0, 7); ctx.fill();
          }
        }
        // hills
        ctx.fillStyle = th.hill;
        for (si = 0; si < hills.length; si++){ var hl = hills[si]; rr(hl.x, groundY - hl.h, hl.w, hl.h + 4, 8); ctx.fill(); }
        // clouds
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        for (si = 0; si < clouds.length; si++){
          var c = clouds[si], cs = c.s * S;
          ctx.beginPath();
          ctx.arc(c.x, c.y, 13 * cs, 0, 7); ctx.arc(c.x + 15 * cs, c.y + 2 * cs, 10 * cs, 0, 7); ctx.arc(c.x - 15 * cs, c.y + 3 * cs, 9 * cs, 0, 7);
          ctx.fill();
        }

        // ground
        ctx.fillStyle = th.ground;
        ctx.fillRect(-30, groundY, W + 60, H - groundY + 30);
        ctx.fillStyle = th.line;
        ctx.fillRect(-30, groundY, W + 60, 4);
        ctx.fillStyle = '#000';
        ctx.fillRect(-30, groundY + 4, W + 60, 2.5);
        // moving dashes under ground line
        var dashOff = (distPx * (state === 'play' || state === 'crash' ? 1 : 0.25)) % 46;
        ctx.fillStyle = th.dash;
        for (var dx = -46 - dashOff; dx < W + 46; dx += 46) { rr(dx, groundY + 22 * S, 26, 6 * S, 3); ctx.fill(); }
        ctx.fillStyle = 'rgba(255,255,255,.22)';
        for (var dx2 = -46 - dashOff; dx2 < W + 46; dx2 += 46) { rr(dx2 + 18, groundY + 42 * S, 14, 5 * S, 2.5); ctx.fill(); }

        // obstacles
        for (si = 0; si < obstacles.length; si++) drawObstacle(obstacles[si]);

        // pickups
        for (si = 0; si < pickups.length; si++) drawPickup(pickups[si]);

        // rings (behind pops, above obstacles)
        for (si = 0; si < rings.length; si++){
          var r = rings[si], ra = 1 - r.life / r.ttl;
          ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7);
          ctx.lineWidth = 3.5; ctx.strokeStyle = r.c; ctx.globalAlpha = ra; ctx.stroke(); ctx.globalAlpha = 1;
        }
        // particles
        for (si = 0; si < particles.length; si++){
          var p = particles[si], pa = 1 - p.life / p.ttl;
          if (p.kind === 'dust'){
            ctx.globalAlpha = pa * 0.75; ctx.fillStyle = '#e8e2ff';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + p.life * 1.6), 0, 7); ctx.fill(); ctx.globalAlpha = 1;
          } else {
            ctx.globalAlpha = pa;
            drawStar(p.x, p.y, p.r, p.rot, p.c);
            ctx.globalAlpha = 1;
          }
        }

        // runner shadow
        var airK = runner.grounded ? 1 : Math.max(0.45, 1 + runner.y / (520 * S));
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        ctx.beginPath(); ctx.ellipse(runner.x + 40 * S, groundY + 10 * S, 34 * S * airK, 6 * S * airK, 0, 0, 7); ctx.fill();

        // runner: cartoon character with the player's own face
        var slidingNow = runner.grounded && runner.slideT > 0 && state === 'play';
        var bobY = runner.grounded && state === 'play' && !slidingNow ? Math.abs(Math.sin(runner.bob)) * -3.5 * S : 0;
        var sqX = 1, sqY = 1;
        if (!slidingNow && runner.squashT > 0){ var k = runner.squashT / 0.07; sqY = 1 - 0.22 * k; sqX = 1 + 0.18 * k; }
        else if (!slidingNow && runner.stretchT > 0){ var k2 = runner.stretchT / 0.09; sqY = 1 + 0.13 * k2; sqX = 1 - 0.09 * k2; }
        var tilt = state === 'crash' ? runner.rot : (slidingNow ? -0.05 : (runner.grounded ? Math.sin(runner.bob) * 0.03 : Math.max(-0.2, Math.min(0.18, -runner.vy / 5600))));
        var blinkOff = runner.invulnT > 0 && Math.floor(runner.invulnT * 14) % 2 === 0;
        ctx.save();
        ctx.translate(runner.x + 40 * S, groundY - runner.y + bobY);
        ctx.rotate(tilt);
        ctx.scale(sqX, sqY);
        if (!blinkOff) drawCartoonRunner(slidingNow);
        ctx.restore();
        // slide speed lines
        if (slidingNow){
          ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5;
          for (var sl = 0; sl < 3; sl++){
            var sly = groundY - 8 * S - sl * 9 * S;
            ctx.beginPath(); ctx.moveTo(runner.x - 6 * S, sly); ctx.lineTo(runner.x - 30 * S - sl * 7 * S, sly); ctx.stroke();
          }
        }
        // shield bubble / save flash
        if (hasShield || shieldFlashT > 0){
          var bcx = runner.x + 40 * S, bcy = groundY - runner.y - 50 * S;
          var brad = 64 * S + (shieldFlashT > 0 ? (0.45 - shieldFlashT) * 46 * S : Math.sin(performance.now() / 280) * 2.5 * S);
          ctx.beginPath(); ctx.arc(bcx, bcy, brad, 0, 7);
          ctx.fillStyle = shieldFlashT > 0 ? 'rgba(83,181,249,.30)' : 'rgba(83,181,249,.14)';
          ctx.fill();
          ctx.lineWidth = 3; ctx.strokeStyle = '#53B5F9';
          ctx.globalAlpha = shieldFlashT > 0 ? Math.max(shieldFlashT / 0.45, 0.15) : 0.9;
          ctx.stroke(); ctx.globalAlpha = 1;
        }

        // pops
        for (si = 0; si < pops.length; si++){
          var q = pops[si], qa = q.life < 0.55 ? 1 : 1 - (q.life - 0.55) / (q.ttl - 0.55);
          var sc = q.life < 0.14 ? 0.6 + (q.life / 0.14) * 0.5 : 1.1 - Math.min(0.1, (q.life - 0.14) * 0.2);
          ctx.save(); ctx.translate(q.x, q.y); ctx.scale(sc, sc); ctx.globalAlpha = Math.max(qa, 0);
          ctx.font = q.size + 'px "Luckiest Guy","Space Grotesk",sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.strokeText(q.txt, 0, 0);
          ctx.fillStyle = q.c; ctx.fillText(q.txt, 0, 0);
          ctx.restore();
        }
        ctx.restore();
      }

      /* ---------- main loop ---------- */
      var lastT = 0;
      function loop(t){
        requestAnimationFrame(loop);
        if (!lastT) lastT = t;
        var dt = Math.min((t - lastT) / 1000, 0.05);
        lastT = t;
        if (state !== 'pause') update(dt);
        draw();
      }

      /* ---------- input ---------- */
      var touchY = null;
      board.addEventListener('pointerdown', function(e){
        e.preventDefault();
        touchY = e.clientY;
        if (state === 'play') doJump();
      });
      board.addEventListener('pointermove', function(e){
        if (touchY === null || state !== 'play') return;
        if (e.clientY - touchY > 26){ doSlide(); touchY = e.clientY; }
      });
      board.addEventListener('pointerup', function(){ touchY = null; });
      board.addEventListener('pointercancel', function(){ touchY = null; });
      document.getElementById('jumpBtn').addEventListener('click', function(){ initAudio(); if (state === 'play') doJump(); });
      document.getElementById('slideBtn').addEventListener('click', function(){ initAudio(); if (state === 'play') doSlide(); });
      document.addEventListener('keydown', function(e){
        if (e.code === 'Space' || e.key === ' ' || e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W'){
          e.preventDefault();
          if (state === 'play') doJump();
          else if (state === 'pause') resumeGame();
        }
        if (e.code === 'ArrowDown' || e.key === 's' || e.key === 'S'){
          e.preventDefault();
          if (state === 'play') doSlide();
        }
        if (e.key === 'Escape' && state === 'play') pauseGame();
      });
      document.getElementById('playBtn').addEventListener('click', function(){ initAudio(); startCountdown(); });
      document.getElementById('replayBtn').addEventListener('click', function(){ initAudio(); startCountdown(); });
      document.getElementById('restartBtn').addEventListener('click', function(){ initAudio(); startCountdown(); });
      document.getElementById('resumeBtn').addEventListener('click', function(){ resumeGame(); });
      document.getElementById('pauseBtn').addEventListener('click', function(){
        if (state === 'play' || state === 'countdown') pauseGame();
        else if (state === 'pause') resumeGame();
      });
      var muteBtn = document.getElementById('muteBtn');
      muteBtn.addEventListener('click', function(){
        muted = !muted;
        document.getElementById('sndOn').style.display = muted ? 'none' : 'block';
        document.getElementById('sndOff').style.display = muted ? 'block' : 'none';
        muteBtn.setAttribute('aria-label', muted ? '取消静音' : '静音开关');
        if (!muted) initAudio();
      });
      document.addEventListener('visibilitychange', function(){
        if (document.hidden) pauseGame();
      });

      /* ---------- boot ---------- */
      resetRun();
      makeClouds();
      resize();
      requestAnimationFrame(loop);
    })();
    </script>
  </body>
</html>
